services:
  app:
    image: ${APP_IMAGE:-555915161335.dkr.ecr.us-east-1.amazonaws.com/veritas-fullstack:latest}

    container_name: veritas-app
    restart: unless-stopped
    init: true

    env_file:
      - path: .env
        format: raw

    environment:
      NODE_ENV: production
      HOSTNAME: 0.0.0.0
      PORT: "3000"

    ports:
      - "127.0.0.1:3000:3000"

    security_opt:
      - no-new-privileges:true

    cap_drop:
      - ALL

    stop_grace_period: 30s